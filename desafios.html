<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apexora · Sala de Desafíos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
<script>if(/[?&]embed/.test(location.search))document.documentElement.classList.add('embed')</script>
<style>
  
:root{
  --bg:#eeeaf5;--bg2:#e3ddf0;--surface:#fbf9ff;--surface2:#ece7f7;--line:#c9c1de;
  --text:#1c1840;--muted:#5a5683;--acc:#e2ac3a;--on-acc:#241a04;--acc-text:#7a4d00;
  --ape:#5b3fc4;--bad:#b3301f;--ember:#c4501f;
  --display:'Unbounded','Trebuchet MS',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1123;--bg2:#141936;--surface:#1a2043;--surface2:#232a58;--line:#343d74;
    --text:#eae9f6;--muted:#a0a6d0;--acc:#f2d28b;--on-acc:#2a1f05;--acc-text:#f2d28b;
    --ape:#b39bff;--bad:#ff8a7a;--ember:#ff8f5e;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1123;--bg2:#141936;--surface:#1a2043;--surface2:#232a58;--line:#343d74;
  --text:#eae9f6;--muted:#a0a6d0;--acc:#f2d28b;--on-acc:#2a1f05;--acc-text:#f2d28b;
  --ape:#b39bff;--bad:#ff8a7a;--ember:#ff8f5e;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc-text);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}

.app{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:100%}
.rail{background:var(--bg2);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;align-self:start;max-height:calc(100dvh - env(safe-area-inset-top,0px));overflow:auto}
.rail h2{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.rail h2 span{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.85rem}
.pl-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pl{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pl.on{border-color:var(--acc-text);box-shadow:inset 5px 0 0 var(--acc)}
.pl-main{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:center;width:100%;padding:11px 14px;cursor:pointer}
.pl-main:focus-visible{outline:3px solid var(--acc-text);outline-offset:-3px}
.pl-name{font-weight:700;overflow-wrap:anywhere}
.pl-char{grid-column:1;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.pl-pts{grid-row:1/3;grid-column:2;font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--acc-text);font-variant-numeric:tabular-nums}
.pl-lead{font-size:.75rem;color:var(--acc-text);font-weight:700}
.bump{animation:bump .7s ease}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.35)}100%{transform:scale(1)}}
.pl-tools{display:flex;gap:6px;padding:0 10px 10px}
.mini{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 10px;font-size:.85rem;font-weight:700}
.mini:hover{border-color:var(--acc-text)}
.pl.all .pl-pts{display:none}
.empty{color:var(--muted);font-size:.95rem;padding:6px 2px 14px}
.add{margin-top:16px;display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:16px}
.add label{font-size:.8rem;color:var(--muted)}
.fld{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.fld:focus{outline:3px solid var(--acc-text);outline-offset:1px}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;padding:18px 34px;border-bottom:1px solid var(--line)}
.brand{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.15rem}
.brand:focus-visible{outline:3px solid var(--acc-text);outline-offset:4px}
.nav{display:flex;flex-wrap:wrap;gap:4px}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:6px 12px;font-weight:700;color:var(--muted)}
.nav button:hover{color:var(--text)}
.nav button[aria-current="page"]{color:var(--text);border-bottom-color:var(--acc)}
.content{padding:34px;flex:1}
.hints{padding:14px 34px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
kbd{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-family:inherit;font-weight:700;font-size:.8rem}

.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:11px 20px;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--acc-text)}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.btn.pri:hover:not(:disabled){filter:brightness(1.06)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,520px);gap:40px;align-items:center}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,4.6vw,4.2rem);line-height:1.05;letter-spacing:-.02em}
.hero .lead{margin:20px 0 28px;font-size:1.2rem;color:var(--muted);max-width:34em}
.ringwrap{position:relative;width:100%;aspect-ratio:1}
.ringwrap svg{width:100%;height:100%;display:block;overflow:visible}
.ringc{position:absolute;inset:27%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;gap:4px}
.ringc h3{font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,2.6vw,2rem)}
.ringc p{color:var(--muted);font-size:.95rem;line-height:1.3}
.dn{cursor:pointer;outline:none}
.dn circle{fill:var(--surface);stroke:var(--line);stroke-width:2;transition:stroke .2s}
.dn.ape circle{stroke:var(--ape)}.dn.xora circle{stroke:var(--acc-text)}
.dn:hover circle,.dn:focus circle,.dn.sel circle{stroke:var(--text);stroke-width:3}
.dn .ini{font-family:var(--display);font-weight:800;font-size:15px;fill:var(--text);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dn .lab{font-size:12px;font-weight:700;fill:var(--muted);text-anchor:middle;pointer-events:none}
.bond{stroke:var(--line);stroke-width:2;fill:none}
.bond.crack{stroke:var(--ember);stroke-width:2.5;stroke-linejoin:bevel}
.crater{fill:none;stroke:var(--line);stroke-dasharray:2 7;stroke-linecap:round}
.craterfill{fill:var(--surface)}

/* retos */
h1.page{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,3vw,2.6rem);letter-spacing:-.01em;margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:28px;max-width:40em}
.modes{display:grid;border-top:1px solid var(--line)}
.mode{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 24px;align-items:center;padding:22px 8px;border-bottom:1px solid var(--line)}
.mode:hover{background:var(--surface)}
.mode:focus-visible{outline:3px solid var(--acc-text);outline-offset:-3px}
.mode b{font-family:var(--display);font-weight:600;font-size:1.35rem}
.mode span{color:var(--muted)}
.mode em{grid-row:1/3;grid-column:2;font-style:normal;font-family:var(--display);font-weight:600;color:var(--acc-text);white-space:nowrap}

/* play */
.playhead{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin-bottom:22px}
.turn{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 20px 8px 10px}
.turn i{width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-style:normal}
.turn span{color:var(--muted);font-size:.85rem;display:block;line-height:1}
.turn b{font-family:var(--display);font-weight:600;font-size:1.1rem}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3.4vw,44px)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-weight:700;font-size:.95rem;margin-bottom:18px}
.meta .gem{color:var(--acc-text);letter-spacing:.1em}
.q{font-weight:700;font-size:clamp(1.5rem,2.5vw + .6rem,2.6rem);line-height:1.22;max-width:30em;margin-bottom:30px;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opts.two{max-width:760px}
.opt{position:relative;overflow:hidden;text-align:left;display:flex;gap:14px;align-items:center;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:18px 20px;font-size:clamp(1.05rem,1.2vw + .6rem,1.5rem);font-weight:600;min-height:76px}
.opt>*{position:relative;z-index:1}
.opt .lt{font-family:var(--display);font-weight:800;color:var(--acc-text);min-width:1.4em}
.opt:hover:not(:disabled){border-color:var(--acc-text)}
.opt.chosen{border-color:var(--acc-text);border-style:dashed}
.opt .tag{margin-left:auto;font-size:.75rem;font-weight:700;color:var(--muted);text-align:right}
.opt::before{content:"";position:absolute;inset:0;background:var(--acc);opacity:0;z-index:0}
.opt.right{color:var(--on-acc);border-color:var(--acc)}
.opt.right .lt,.opt.right .tag{color:var(--on-acc)}
.opt.right::before{opacity:1;clip-path:polygon(0 0,100% 0,94% 22%,100% 46%,92% 70%,100% 100%,0 100%,0 50%);animation:crack .7s cubic-bezier(.6,0,.2,1)}
@keyframes crack{from{clip-path:polygon(0 0,0 0,0 22%,0 46%,0 70%,0 100%,0 100%,0 50%)}}
.opt.wrong{border-color:var(--bad);color:var(--bad)}
.opt.wrong .lt{color:var(--bad)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.peek::after{content:"";position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--acc-text);opacity:.7;z-index:2}
.ctrls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}
.timer{display:flex;align-items:center;gap:14px;margin-left:auto;min-width:200px}
.tnum{font-family:var(--display);font-weight:800;font-size:2.2rem;min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.tnum.low{color:var(--bad)}
.tbar{flex:1;height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.tbar i{display:block;height:100%;background:var(--acc);width:100%;transition:width 1s linear}
.tbar i.low{background:var(--bad)}
.result{margin-top:26px;border-top:1px dashed var(--line);padding-top:22px}
.verdict{font-family:var(--display);font-weight:800;font-size:1.5rem;margin-bottom:8px}
.verdict.ok{color:var(--acc-text)}.verdict.no{color:var(--bad)}
.result p{max-width:44em;font-size:1.1rem}
.cheat{margin-top:16px;font-size:.85rem;color:var(--muted);font-style:italic}
.clues{list-style:none;counter-reset:c;margin:0 0 8px;padding:0;display:grid;gap:12px;max-width:44em}
.clues li{counter-increment:c;display:grid;grid-template-columns:2.2em 1fr;gap:6px;font-size:clamp(1.15rem,1.4vw + .6rem,1.7rem);font-weight:600;line-height:1.3}
.clues li::before{content:counter(c);font-family:var(--display);font-weight:800;color:var(--acc-text)}
.answer{margin-top:20px;background:var(--bg2);border-radius:12px;padding:18px 22px;max-width:44em}
.answer h3{font-family:var(--display);font-weight:800;font-size:1.8rem;margin-bottom:6px}
.evs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ev{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:16px 20px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px}
.ev .lt{grid-row:1/3;font-family:var(--display);font-weight:800;font-size:1.8rem;color:var(--acc-text);align-self:center;min-width:1.2em}
.ev b{font-size:1.25rem}.ev span{color:var(--muted)}
.ev .yr{grid-column:2;font-family:var(--display);font-weight:800;color:var(--acc-text);font-size:1.1rem}
.ev.done{border-color:var(--acc-text)}
.twist{margin-top:20px;border-left:5px solid var(--ember);padding:10px 18px;background:var(--bg2);border-radius:0 12px 12px 0;font-size:1.25rem;font-weight:600}
.place{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:2px 14px;font-weight:700;font-size:.9rem;color:var(--muted)}
.rt{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,2.6vw,2.6rem);margin:14px 0}
.scenetxt{font-size:clamp(1.15rem,1.4vw + .6rem,1.7rem);max-width:36em;line-height:1.4;font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:4px 14px;font-size:.9rem;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.banner{border:1px dashed var(--acc-text);border-radius:12px;padding:14px 18px;margin-bottom:22px;color:var(--muted)}

/* dice */
.dgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:34px}
.dctl{display:grid;gap:18px;align-content:start}
.dctl label{font-weight:700;font-size:.9rem;color:var(--muted);display:block;margin-bottom:6px}
.sides{display:flex;flex-wrap:wrap;gap:8px}
.step{display:flex;align-items:center;gap:10px}
.step b{font-family:var(--display);min-width:2.5ch;text-align:center;font-size:1.2rem}
.dres{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
.dnum{font-family:var(--display);font-weight:800;font-size:clamp(4rem,11vw,9rem);line-height:1;font-variant-numeric:tabular-nums}
.dnum.crit{color:var(--acc-text)}.dnum.fumble{color:var(--bad)}
.dbrk{color:var(--muted);font-size:1.1rem}
.dtag{font-family:var(--display);font-weight:800;font-size:1.3rem}
.hist{margin:26px 0 0;padding:0;list-style:none;display:grid;gap:4px;color:var(--muted)}
.hist b{color:var(--text)}

/* shop */
.shop{border-top:1px solid var(--line)}
.rw{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 22px;align-items:center;padding:18px 6px;border-bottom:1px solid var(--line)}
.rw b{font-family:var(--display);font-weight:600;font-size:1.15rem}
.rw span{color:var(--muted);grid-column:1}
.cost{grid-row:1/3;grid-column:2;font-family:var(--display);font-weight:800;color:var(--acc-text);font-size:1.4rem;white-space:nowrap}
.rw .btn,.rw .row{grid-row:1/3;grid-column:3}
.balance{display:inline-flex;gap:10px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 18px;margin-bottom:24px}
.balance b{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--acc-text)}

/* registro */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px}
.panel h2{font-family:var(--display);font-weight:600;font-size:1.1rem;margin-bottom:14px}
.set{display:grid;gap:14px}
.set label{display:grid;gap:4px;font-weight:700;font-size:.9rem}
.set label.chk{grid-template-columns:auto 1fr;align-items:center;gap:10px}
.set small{color:var(--muted);font-weight:400}
.log{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto;border-top:1px solid var(--line)}
.log li{display:flex;gap:12px;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-size:.95rem}
.log time{color:var(--muted);font-size:.8rem;white-space:nowrap}
.log .d{font-family:var(--display);font-weight:600;white-space:nowrap}
.log .d.p{color:var(--acc-text)}.log .d.n{color:var(--bad)}
textarea.fld{min-height:110px;font-family:ui-monospace,monospace;font-size:.8rem}

dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:min(460px,92vw);width:100%}
dialog::backdrop{background:rgba(8,10,24,.62)}
dialog h3{font-family:var(--display);font-weight:600;font-size:1.15rem;margin-bottom:14px}
dialog .set{margin-bottom:18px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--acc);color:var(--on-acc);font-weight:700;border-radius:99px;padding:10px 22px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

.bank .errs{color:var(--bad);margin:8px 0 6px;padding-left:20px}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  .pl-list{display:flex;overflow-x:auto;padding-bottom:6px}
  .pl{min-width:190px;flex:0 0 auto}
  .hero,.dgrid,.cols{grid-template-columns:1fr}
  .top,.content,.hints{padding-left:18px;padding-right:18px}
}
@media (max-width:640px){
  .opts,.evs{grid-template-columns:1fr}
  .rw{grid-template-columns:1fr auto}
  .rw .btn,.rw .row{grid-column:1/3;grid-row:auto}
  .cost{grid-row:1}
  .timer{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){
  .bump,.opt.right::before{animation:none}
  .tbar i,#toast{transition:none}
}
.imgbox{display:inline-block;max-width:100%;overflow:hidden;border-radius:14px;line-height:0;background:var(--bg2)}
.imgbox img{display:block;max-width:100%;max-height:60dvh;object-fit:contain;transition:filter .7s ease}
@media (prefers-reduced-motion:reduce){.imgbox img{transition:none}}
html.embed.embed{--bg:#0a1220;--bg2:#0e1a33;--surface:#101e38;--surface2:#16284a;--line:#e3bf7344;--text:#f3ead6;--muted:#a9b3cf;--acc:#e3bf73;--on-acc:#1a1208;--acc-text:#f7e6b0;--ape:#b39bff;--bad:#ff8a7a;--ember:#ff8f5e;--display:'Cinzel',Georgia,serif;--body:'Crimson Pro',Georgia,serif}
html.embed body{background:transparent;font-size:18px}
html.embed .brand{display:none}
html.embed .top{padding:12px 24px}
html.embed .btn,html.embed .pl,html.embed .panel{border-radius:14px}
html.embed h1,html.embed h2{text-transform:uppercase;letter-spacing:.04em}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail" aria-label="Jugadores"></aside>
  <div class="main" id="main"></div>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const DEITIES=[
 {n:"Ape",d:"Entropía y oscuridad",c:"ape"},{n:"Xora",d:"Orden y luz",c:"xora"},
 {n:"Millot",d:"Creación"},{n:"Jilper",d:"Destrucción"},
 {n:"Cumacur",d:"Infinidad"},{n:"Cabala",d:"Finito"},
 {n:"Ganore",d:"La Nada"},{n:"Kiprika",d:"El Todo"},
 {n:"Tapiem",d:"Gravedad"},{n:"Dacama",d:"Tiempo"}
];
const PJ_NAMES=["Zarick","Bane Ironhand","Karim Balteus","Vina Miceus","Seah de Pato","Tomah de la Luz de Xora","Andreas Light","Pin Kuku","Gobz Gobinson","Valmey Sialí","Seilá Anamé","Lael Anamé","Laki Unmei","Zene","Caelum"];

const TRIVIA=[

 S.log.unshift({id:uid(),ts:Date.now(),kind,text,deltas:applied});S.log=S.log.slice(0,200);save();

function stopTimer(){clearInterval(tmr);tmr=null;if(C)C.running=false}
function timerStart(){
 if(!C||!S.settings.timer)return;stopTimer();
 C.remaining=S.settings.timer;C.running=true;C.timeUp=false;paintTimer();
 tmr=setInterval(()=>{C.remaining--;
  if(C.remaining<=0){stopTimer();C.remaining=0;C.timeUp=true;beep(200,600)}else if(C.remaining<=5)beep(660,80);
  paintTimer()},1000);
}

 n.textContent=C.remaining;n.classList.toggle("low",low);
 b.style.width=Math.max(0,C.remaining/tot*100)+"%";b.classList.toggle("low",low);
}

function pick(mode,pool){
 let used=S.used[mode]=S.used[mode]||[];
 let av=pool.filter(x=>!used.includes(x.id));
 if(!av.length){S.used[mode]=used=[];av=pool.slice()}
 const it=av[Math.floor(Math.random()*av.length)];used.push(it.id);save();return it;
}
function newItem(mode){
 if(mode==="trivia"){
  const all=poolOf("trivia",TRIVIA);let pool=all.filter(t=>(F.cat==="Todas"||t.cat===F.cat)&&(!F.lvl||t.lvl===F.lvl));
  if(!pool.length)pool=all;
  const t=pick("trivia",pool),opts=shuffle([t.right,...t.wrong]);
  return Object.assign({},t,{opts,ai:opts.indexOf(t.right)});
 }
 if(mode==="vof"){const v=pick("vof",poolOf("vof",VOF));return Object.assign({},v,{opts:["Verdadero","Falso"],ai:v.t?0:1})}
 if(mode==="quien")return pick("quien",poolOf("quien",QUIEN));
 if(mode==="rol")return pick("rol",poolOf("rol",ROL));
 if(mode==="imagen")return IMGS.length?pick("imagen",IMGS):null;
 if(mode==="crono"){
  const cc=cust("crono"),cp=S.settings.onlyCustom&&cc.length>=4?cc:CRONO.concat(cc);
  const evs=shuffle(cp).slice(0,4);
  return {evs,order:evs.slice().sort((a,b)=>a.y-b.y)};
 }
}

 stopTimer();view="play";
 C={mode,resolved:false,revealed:false,chosen:null,running:false,remaining:S.settings.timer,timeUp:false,twist:null,clues:1};
 C.item=newItem(mode);
 C.pts=mode==="trivia"?TRIVIA_PTS[C.item.lvl]:mode==="vof"?VOF_PTS[C.item.lvl]:0;
 render();window.scrollTo(0,0);
}

function nextBar(){return `<div class="ctrls" style="margin-top:20px"><button class="btn pri" data-act="nextq">Siguiente reto ›</button><span style="color:var(--muted)">Flecha derecha</span></div>`}

function stageChoice(){
 const it=C.item,v=C.mode==="vof";
 const gems="◆".repeat(it.lvl)+"◇".repeat(3-it.lvl);
 const correct=C.chosen!=null?C.chosen===it.ai:null;
 let opts=it.opts.map((o,i)=>{
  const cl=["opt"];if(C.chosen===i)cl.push("chosen");
  if(C.revealed){if(i===it.ai&&correct===true)cl.push("right");else if(C.chosen===i)cl.push("wrong");else cl.push("dim")}
  else if(S.settings.cheat&&i===it.ai)cl.push("peek");
  const tag=C.chosen===i?(C.revealed?(i===it.ai?"Su respuesta ✓":"Su respuesta ✗"):"Su respuesta"):"";
  return `<button class="${cl.join(" ")}" data-act="choose" data-i="${i}" ${C.revealed?"disabled":""} aria-pressed="${C.chosen===i}"><span class="lt">${v?(i?"F":"V"):LET[i]}</span><span>${esc(o)}</span><span class="tag">${tag}</span></button>`;
 }).join("");
 let res="";
 if(C.revealed){
  const vt=correct===null?"Respuesta revelada":correct?"✓ Correcto":"✗ Incorrecto";
  res=`<div class="result"><div class="verdict ${correct===true?"ok":correct===false?"no":""}">${vt}</div><p>${correct===true?esc(it.exp):""}</p>${C.resolved?nextBar():awardBtns(shortQ(it.q),C.pts,correct!==false)}</div>`;
 }
 return `<div class="stage"><div class="meta">${v?"Verdadero o falso":esc(it.cat)}<span class="gem" aria-label="dificultad ${it.lvl} de 3">${gems}</span><span>${C.pts} ${cur().toLowerCase()}</span></div>
 <h2 class="q">${esc(it.q)}</h2><div class="opts ${v?"two":""}">${opts}</div>
 <div class="ctrls">${C.revealed?"":`<button class="btn" data-act="start">Iniciar tiempo</button><button class="btn pri" data-act="reveal">Revelar respuesta</button>`}${timerHTML()}</div>
 ${cheatLine(it.opts[it.ai])}${res}</div>`;
}
function stageQuien(){

/* ===== vistas ===== */
function ringSVG(){
 const cx=200,cy=200,r=150;
 const pts=DEITIES.map((d,i)=>{const a=(-90+i*36)*Math.PI/180;return Object.assign({},d,{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a),a})});
 let bonds="";
 [[0,1],[2,3],[4,5],[6,7]].forEach(([a,b])=>{
  const A=pts[a],B=pts[b];
  if(a===0){
   const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;
   let p=`M${A.x.toFixed(1)} ${A.y.toFixed(1)}`;
   [[.2,7],[.4,-7],[.6,7],[.8,-7]].forEach(([t,o])=>{p+=` L${(A.x+dx*t+nx*o).toFixed(1)} ${(A.y+dy*t+ny*o).toFixed(1)}`});
   p+=` L${B.x.toFixed(1)} ${B.y.toFixed(1)}`;bonds+=`<path class="bond crack" d="${p}"/>`;
  }else bonds+=`<line class="bond" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>`;
 });

const BANK_LABEL={trivia:"Trivia",vof:"Verdadero o falso",quien:"¿Quién soy?",rol:"Prueba de rol",crono:"Cronología"};
const BANK_HELP=`trivia | Categoría | nivel 1-3 | Pregunta | Correcta | Incorrecta 1 | Incorrecta 2 | Incorrecta 3 | Explicación
vof | verdadero o falso | nivel 1-3 | Afirmación | Explicación

const BANK_EXAMPLE=`trivia | Mundo | 2 | ¿Quién lidera Lumis? | Inargo | Valeria | Puj | Tsuji | Una IA gobierna Lumis.
vof | falso | 1 | Umbra adora a Xora. | Umbra no tiene religión oficial.
rol | El mercader nervioso | Boro | Un mercader te ofrece un mapa dudoso.

const BANK_PROMPT=`Convierte el siguiente contenido nuevo de Apexora en desafíos para mi plataforma de juegos. Devuelve solo líneas, una por desafío, con los campos separados por | y sin texto extra. Formatos:
${BANK_HELP}
Reglas: usa solo hechos del contenido que te pase, sin inventar lore. Nivel 1 es fácil y 3 es difícil. En "quien" las 5 pistas van de la más vaga a la más específica, escritas en primera persona. No uses el carácter | dentro de los textos. Contenido nuevo:
`;
function bankKey(c){return c.type+"|"+String(c.x.q||c.x.a||c.x.t||"")+(c.x.y??"")}
function parseBank(txt){
 const ok=[],err=[],bad=[];
 txt.split(/\r?\n/).forEach((raw,i)=>{
  const line=raw.trim();if(!line||line.startsWith("#"))return;
  const f=line.split("|").map(x=>x.trim()),t=f[0].toLowerCase(),id="c"+uid();
  const fail=m=>{err.push("Línea "+(i+1)+": "+m);bad.push(raw)};
  const lv=n=>{const v=parseInt(n);return v>=1&&v<=3?v:null};
  if(t==="trivia"){
   if(f.length<8||f.slice(1,8).some(x=>!x))return fail("trivia necesita categoría, nivel, pregunta, la correcta y 3 incorrectas.");
   const l=lv(f[2]);if(!l)return fail("el nivel debe ser 1, 2 o 3.");
   ok.push({id,type:t,x:{id,cat:f[1],lvl:l,q:f[3],right:f[4],wrong:[f[5],f[6],f[7]],exp:f[8]||""}});
  }else if(t==="vof"){
   if(f.length<4||!f[3])return fail("vof necesita verdadero o falso, nivel y la afirmación.");
   const v=f[1].toLowerCase(),tv=["verdadero","v","true","sí","si"].includes(v),fv=["falso","f","false","no"].includes(v);
   if(!tv&&!fv)return fail("escribe «verdadero» o «falso» en el segundo campo.");
   const l=lv(f[2]);if(!l)return fail("el nivel debe ser 1, 2 o 3.");
   ok.push({id,type:t,x:{id,q:f[3],t:tv,lvl:l,exp:f[4]||""}});
  }else if(t==="quien"){
   if(f.length<8||f.slice(1,8).some(x=>!x))return fail("quien necesita categoría, respuesta y exactamente 5 pistas.");
   ok.push({id,type:t,x:{id,cat:f[1],a:f[2],clues:f.slice(3,8),bio:f[8]||""}});
  }else if(t==="rol"){
   if(f.length<4||f.slice(1,4).some(x=>!x))return fail("rol necesita título, lugar y escena.");
   ok.push({id,type:t,x:{id,t:f[1],place:f[2],x:f[3]}});
  }else if(t==="crono"){
   const y=parseInt(f[1]);if(f.length<3||isNaN(y)||!f[2])return fail("crono necesita año (número), título y descripción.");
   ok.push({id,type:t,x:{id,y,t:f[2],d:f[3]||""}});
  }else fail("tipo «"+f[0]+"» no reconocido. Usa trivia, vof, quien, rol o crono.");
 });
 return {ok,err,bad};
}

let IMGS=[];
function idb(){return new Promise((res,rej)=>{
 try{const r=indexedDB.open("apexora-img",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("images",{keyPath:"id"});
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
 }catch(e){rej(e)}})}
function idbRun(mode,fn){return idb().then(db=>new Promise((res,rej)=>{
 const tx=db.transaction("images",mode),st=tx.objectStore("images"),rq=fn(st);
 tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);
}))}
const idbAll=()=>idbRun("readonly",s=>s.getAll());
const idbPut=m=>idbRun("readwrite",s=>s.put(m));
const idbDel=id=>idbRun("readwrite",s=>s.delete(id));

function readImage(file){
 const fr=new FileReader();
 fr.onload=()=>{const im=new Image();
  im.onload=()=>{const M=900,k=Math.min(1,M/Math.max(im.width,im.height));
   const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
   const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
   imgDraft.src=c.toDataURL("image/jpeg",.8);render()};
  im.onerror=()=>toast("No se pudo leer la imagen");
  im.src=fr.result};
 fr.readAsDataURL(file);
}
document.addEventListener("change",e=>{const t=e.target;

 const lead=S.players.length>1?[...S.players].sort((a,b)=>b.pts-a.pts):[];
 const leadId=lead.length&&lead[0].pts>0&&lead[0].pts>lead[1].pts?lead[0].id:null;
 const list=S.players.map((p,i)=>{
  const on=S.active===p.id;
  return `<li class="pl ${on?"on":""}"><button class="pl-main" data-act="pick" data-id="${p.id}" aria-pressed="${on}"><span class="pl-name">${i<9?`<kbd>${i+1}</kbd> `:""}${esc(p.name)}</span><span class="pl-char">${p.id===leadId?`<span class="pl-lead">★ va primero</span> `:""}${esc(p.char)}</span><span class="pl-pts" data-pid="${p.id}">${p.pts}</span></button>
  ${on?`<div class="pl-tools"><button class="mini" data-act="adj" data-v="-10" aria-label="Restar 10">−10</button><button class="mini" data-act="adj" data-v="10" aria-label="Sumar 10">+10</button><button class="mini" data-act="editp" data-id="${p.id}">Editar</button></div>`:""}</li>`;
 }).join("");
 const all=S.players.length>1?`<li class="pl all ${S.active==="all"?"on":""}"><button class="pl-main" data-act="pick" data-id="all" aria-pressed="${S.active==="all"}"><span class="pl-name">Todo el grupo</span><span class="pl-char">Los puntos van a cada jugador</span></button></li>`:"";
 $("#rail").innerHTML=`<h2>Jugadores <span>${esc(cur())}</span></h2>
 ${S.players.length?`<ul class="pl-list">${list}${all}</ul>`:`<p class="empty">Aún no hay jugadores. Añade al primero para empezar.</p>`}
 <form class="add" id="addForm"><label for="pn">Nombre del jugador</label><input class="fld" id="pn" required maxlength="30" autocomplete="off">
 <label for="pc">Personaje (opcional)</label><input class="fld" id="pc" list="pjs" maxlength="40" autocomplete="off"><datalist id="pjs">${PJ_NAMES.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
 <button class="btn pri" type="submit">Añadir jugador</button></form>`;
 S.players.forEach(p=>{
  if(lastPts[p.id]!=null&&lastPts[p.id]!==p.pts){const el=$(`.pl-pts[data-pid="${p.id}"]`);if(el)el.classList.add("bump")}
  lastPts[p.id]=p.pts;
 });
}
function renderMain(){
 const nav=[["home","Sala"],["retos","Retos"],["dados","Dados"],["tienda","Tienda"],["registro","Registro"]];
 const curNav=view==="play"?"retos":view;
 const body=view==="home"?viewHome():view==="retos"?viewRetos():view==="play"?viewPlay():view==="dados"?viewDados():view==="tienda"?viewTienda():viewRegistro();
 $("#main").innerHTML=`<header class="top"><button class="brand" data-act="nav" data-v="home"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 2 L12 10 L17 14 L11 19 L16 28" fill="none" stroke="var(--ember)" stroke-width="2.4" stroke-linejoin="bevel"/></svg>Apexora</button>
 <nav class="nav" aria-label="Secciones">${nav.map(n=>`<button data-act="nav" data-v="${n[0]}" ${curNav===n[0]?'aria-current="page"':""}>${n[1]}</button>`).join("")}</nav></header>
 <main class="content">${body}</main>
 <footer class="hints"><kbd>Espacio</kbd> iniciar tiempo, pista o tirada · <kbd>R</kbd> revelar · <kbd>A</kbd>–<kbd>D</kbd> marcar respuesta · <kbd>N</kbd> siguiente jugador · <kbd>1</kbd>–<kbd>9</kbd> elegir jugador · <kbd>→</kbd> siguiente reto</footer>`;
 if(view==="home")bindRing();
 if(view==="play")paintTimer();
}
function render(){renderRail();renderMain()}
function bindRing(){
 const c=$("#ringc");
 document.querySelectorAll(".dn").forEach(g=>{
  const i=+g.dataset.i,show=()=>{ringSel=i;c.innerHTML=ringCenter(i);document.querySelectorAll(".dn").forEach(x=>x.classList.toggle("sel",x===g))};
  g.addEventListener("pointerenter",show);g.addEventListener("focus",show);g.addEventListener("click",show);
 });
}

/* ===== diálogos ===== */
function dlg(html){const d=$("#dlg");d.innerHTML=html;if(!d.open)d.showModal()}
function closeDlg(){const d=$("#dlg");if(d.open)d.close()}
function ask(title,text,yes,label="Confirmar"){
 pendingYes=yes;
 dlg(`<h3>${esc(title)}</h3><p style="margin-bottom:20px;color:var(--muted)">${esc(text)}</p><div class="row"><button class="btn pri" data-act="yes">${esc(label)}</button><button class="btn ghost" data-act="close">Cancelar</button></div>`);
}
function rewardDialog(r){
 dlg(`<h3>${r?"Editar recompensa":"Nueva recompensa"}</h3><div class="set"><label>Nombre<input class="fld" id="rn" value="${esc(r?r.name:"")}" maxlength="40"></label>
 <label>Descripción<input class="fld" id="rd" value="${esc(r?r.desc:"")}" maxlength="140"></label>
 <label>Costo<input class="fld" id="rc" type="number" min="1" value="${r?r.cost:50}"></label></div>
 <div class="row"><button class="btn pri" data-act="saverw" data-id="${r?r.id:""}">Guardar</button><button class="btn ghost" data-act="close">Cancelar</button></div>`);
}

/* ===== acciones ===== */
const A={
 nav(b){stopTimer();view=b.dataset.v;C=null;render();window.scrollTo(0,0)},
 mode(b){const m=b.dataset.m;if(m==="trivia"){stopTimer();view="play";C={mode:"trivia",picking:true};render();window.scrollTo(0,0)}else startMode(m)},
 level(b){F.lvl=+b.dataset.v;startMode("trivia")},
 surprise(){const ks=Object.keys(MODES).filter(k=>k!=="imagen"||IMGS.length);startMode(ks[Math.floor(Math.random()*ks.length)])},
 pick(b){S.active=b.dataset.id;save();render()},
 adj(b){const t=targets();if(!t.length)return;const m={};t.forEach(id=>m[id]=+b.dataset.v);applyDelta(m,`${targetLabel()}: ajuste manual`,"adj");render()},
 editp(b){const p=P(b.dataset.id);if(!p)return;
  dlg(`<h3>Editar jugador</h3><div class="set"><label>Nombre<input class="fld" id="en" value="${esc(p.name)}" maxlength="30"></label><label>Personaje<input class="fld" id="ec" value="${esc(p.char)}" maxlength="40"></label><label>${esc(cur())}<input class="fld" id="ep" type="number" min="0" value="${p.pts}"></label></div>
  <div class="row"><button class="btn pri" data-act="savep" data-id="${p.id}">Guardar</button><button class="btn danger" data-act="delp" data-id="${p.id}">Quitar jugador</button><button class="btn ghost" data-act="close">Cancelar</button></div>`)},
 savep(b){const p=P(b.dataset.id);if(!p)return;const n=$("#en").value.trim();if(n)p.name=n;p.char=$("#ec").value.trim();
  const np=Math.max(0,parseInt($("#ep").value)||0);if(np!==p.pts){applyDelta({[p.id]:np-p.pts},`${p.name}: puntos corregidos`,"adj")}
  save();closeDlg();render()},
 delp(b){const p=P(b.dataset.id);if(!p)return;closeDlg();
  ask("¿Quitar a "+p.name+"?","Se pierden sus puntos. Esta acción no se puede deshacer.",()=>{S.players=S.players.filter(x=>x.id!==p.id);if(S.active===p.id)S.active=S.players[0]?S.players[0].id:null;save();render()},"Quitar")},
 close(){closeDlg()},
 yes(){const f=pendingYes;pendingYes=null;closeDlg();if(f)f()},
 choose(b){if(C.revealed)return;const i=+b.dataset.i;C.chosen=C.chosen===i?null:i;render()},
 start(){timerStart();render()},
 reveal(){if(C.revealed)return;stopTimer();C.revealed=true;render()},
 give(b){const n=+b.dataset.n;if(award(n,b.dataset.t||MODES[C.mode].name)){C.resolved=true;stopTimer();render()}},
 none(){C.resolved=true;C.revealed=true;stopTimer();render()},
 nextq(){if(S.settings.autoNext&&S.players.length>1&&S.active!=="all")nextPlayer();startMode(C.mode)},
 clue(){if(C.clues<5){C.clues++;render()}},
 guess(){if(award(cluePts(),"¿Quién soy? "+C.item.a+" (pista "+C.clues+")")){C.revealed=true;C.resolved=true;render()}},
 giveup(){C.revealed=true;C.resolved=true;render()},
 twist(){C.twist=TWISTS[Math.floor(Math.random()*TWISTS.length)];render()},
 fcat(b){F.cat=b.dataset.v;startMode("trivia")},
 flvl(b){F.lvl=+b.dataset.v;startMode("trivia")},
 dside(b){D.sides=+b.dataset.v;render()},
 dcount(b){D.count=Math.min(10,Math.max(1,D.count+ +b.dataset.v));render()},
 dmod(b){D.mod=Math.min(20,Math.max(-20,D.mod+ +b.dataset.v));render()},
 roll(){roll()},
 dgive(){if(award(Math.max(1,parseInt(D.pts)||1),"tirada de dados"))render()},
 redeem(b){const r=S.rewards.find(x=>x.id===b.dataset.id),p=P(S.active);if(!r||!p)return;
  ask("¿Canjear "+r.name+"?",`${p.name} gasta ${r.cost} ${cur().toLowerCase()} y le quedan ${p.pts-r.cost}.`,()=>{applyDelta({[p.id]:-r.cost},`${p.name} canjeó ${r.name}`,"redeem");beep(520,160);toast(`${p.name} canjeó ${r.name}`);render()},"Canjear")},
 shopedit(){shopEdit=!shopEdit;render()},
 addrw(){rewardDialog(null)},
 editrw(b){rewardDialog(S.rewards.find(x=>x.id===b.dataset.id))},
 saverw(b){const name=$("#rn").value.trim();if(!name)return;const o={name,desc:$("#rd").value.trim(),cost:Math.max(1,parseInt($("#rc").value)||1)};
  if(b.dataset.id){Object.assign(S.rewards.find(x=>x.id===b.dataset.id),o)}else S.rewards.push(Object.assign({id:uid()},o));
  S.rewards.sort((a,b)=>a.cost-b.cost);save();closeDlg();render()},
 delrw(b){S.rewards=S.rewards.filter(x=>x.id!==b.dataset.id);save();render()},
 undo(){const l=S.log.find(x=>Object.keys(x.deltas||{}).length);if(!l)return;
  for(const [id,d] of Object.entries(l.deltas)){const p=P(id);if(p)p.pts=Math.max(0,p.pts-d)}
  S.log=S.log.filter(x=>x!==l);save();toast("Movimiento deshecho");render()},
 bankadd(){
  const r=parseBank(bankText);let added=0,dup=0;
  for(const c of r.ok){if(S.custom.some(o=>bankKey(o)===bankKey(c))){dup++;continue}S.custom.push(c);added++}
  save();bankText=r.bad.join("\n");bankMsg={added,dup,err:r.err};render();
 },
 bankdel(b){S.custom=S.custom.filter(c=>c.id!==b.dataset.id);save();render()},
 bankclear(){ask("¿Vaciar el banco propio?","Se quitan todos los desafíos que añadiste. Los de fábrica se quedan.",()=>{S.custom=[];save();bankMsg=null;render()},"Vaciar")},
 copyprompt(){try{navigator.clipboard.writeText(BANK_PROMPT).then(()=>toast("Instrucciones copiadas. Pégalas en un chat con Claude"),()=>toast("No se pudo copiar"))}catch(e){toast("No se pudo copiar")}},
  imgstep(){if(C&&C.mode==="imagen"&&(C.step||0)<2&&!C.revealed){C.step=(C.step||0)+1;render()}},
 imgguess(){if(award(IMG_PTS[C.step||0],"Adivina la imagen: "+C.item.answer)){C.revealed=true;C.resolved=true;render()}},
  async imgadd(){
  const d=imgDraft,a=d.answer.trim();
  if(!d.src||!a){toast("Elige una imagen y escribe qué es");return}
  const m={id:"i"+uid(),src:d.src,answer:a,cat:d.cat};
  try{await idbPut(m)}catch(e){toast("No se pudo guardar la imagen en el navegador");return}
  IMGS.push(m);imgDraft={src:"",answer:"",cat:d.cat};toast("Imagen añadida");render();
 },
  async imgdel(b){try{await idbDel(b.dataset.id)}catch(e){}IMGS=IMGS.filter(m=>m.id!==b.dataset.id);render()},
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b,e)});
document.addEventListener("submit",e=>{
 if(e.target.id!=="addForm")return;e.preventDefault();
 const n=$("#pn").value.trim();if(!n)return;
 const p={id:uid(),name:n,char:$("#pc").value.trim(),pts:0};S.players.push(p);if(!P(S.active)&&S.active!=="all")S.active=p.id;
 save();render();$("#pn").focus();
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.setting){const k=t.dataset.setting;
  if(k==="currency"){S.currency=t.value.trim()||"Fragmentos"}
  else if(k==="timer"){S.settings.timer=Math.min(300,Math.max(0,parseInt(t.value)||0))}
  else S.settings[k]=t.checked;
  save();renderRail();}
});
document.addEventListener("input",e=>{const t=e.target;
 if(t.dataset.set==="dc")D.dc=t.value;
 if(t.dataset.set==="dpts")D.pts=t.value;
 if(t.dataset.set==="bank")bankText=t.value;
});

/* ===== dados ===== */
function roll(){
 if(D.rolling)return;D.rolling=true;let n=0;beep(300,40);
 render();
 const iv=setInterval(()=>{const el=$("#dnum");if(el){el.textContent=1+Math.floor(Math.random()*D.sides*D.count);el.style.color=""}
  if(++n>=9){clearInterval(iv);
   const rolls=[...Array(D.count)].map(()=>1+Math.floor(Math.random()*D.sides));
   const total=rolls.reduce((a,b)=>a+b,0)+D.mod,dc=D.dc===""?"":parseInt(D.dc);
   D.res={rolls,total,sides:D.sides,count:D.count,mod:D.mod,dc:isNaN(dc)?"":dc};
   D.res.ok=D.res.dc===""?null:total>=D.res.dc;
   D.hist.unshift(D.res);D.rolling=false;beep(660,120);render();}
 },70);
}

/* ===== teclado ===== */
document.addEventListener("keydown",e=>{
 const tg=e.target,tag=tg.tagName;
 if(["INPUT","TEXTAREA","SELECT"].includes(tag)||$("#dlg").open||e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key.toLowerCase();
 if(/^[1-9]$/.test(k)&&S.players[+k-1]){S.active=S.players[+k-1].id;save();render();return}
 if(k==="n"){nextPlayer();render();return}
 if(view==="dados"&&k===" "&&tag!=="BUTTON"){e.preventDefault();roll();return}
 if(view!=="play"||!C||C.picking)return;
 const m=C.mode;
 if(k===" "&&tag!=="BUTTON"){e.preventDefault();if(m==="quien")A.clue();else if(m==="imagen")A.imgstep();else if(!C.revealed&&!C.resolved)A.start();return}
 if(k==="r"&&m!=="quien"&&m!=="rol"&&m!=="imagen")A.reveal();
 if((m==="trivia"||m==="vof")&&!C.revealed){
  const i=m==="vof"?({v:0,f:1,a:0,b:1})[k]:"abcd".indexOf(k);
  if(i!=null&&i>=0&&C.item.opts[i]!==undefined){C.chosen=C.chosen===i?null:i;render()}
 }
 if(k==="arrowright"&&C.resolved)A.nextq();
});

render(),imgInit();

</script>
</body>
